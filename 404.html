<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Manish Kumar Milan</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
  :root { --cabinet:#D5D8D4; --groove:#B3B9B4; --ink:#2C3236; --ink-2:#555D63; --yellow:#F2C200; --yellow-hover:#E2B400; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--cabinet); color: var(--ink); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; }
  .panel { max-width: 560px; background: #fff; border-radius: 4px; padding: clamp(28px, 6vw, 48px);
           box-shadow: 0 0 0 6px var(--cabinet), 0 0 0 7px var(--groove); }
  h1 { margin: 0 0 12px; font-size: clamp(1.75rem, 5vw, 2.4rem); font-weight: 750; font-stretch: 118%; line-height: 1.1; }
  p { margin: 0 0 26px; color: var(--ink-2); font-size: 1.0625rem; line-height: 1.55; }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.1em; border-radius: 3px;
      background: var(--yellow); color: var(--ink); font-weight: 650; text-decoration: none; }
  a:hover { background: var(--yellow-hover); }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
  <main class="panel">
    <h1>There's no page at this address.</h1>
    <p>The link may be mistyped or out of date.</p>
    <a href="/">Go to the homepage</a>
  </main>
</body>
</html>
